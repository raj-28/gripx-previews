<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070D"><title>DealDrop</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/theme.css"></head><body><script src="assets/app.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id')||'cursor';
const d=DEALS.find(x=>x.id===id)||DEALS[0];document.title=d.name+' - DealDrop';
const sim=DEALS.filter(x=>x.id!==d.id&&x.cat===d.cat).concat(DEALS.filter(x=>x.id!==d.id&&x.cat!==d.cat)).slice(0,3);
shell('home',`
 <a class="back" href="index.html">${ICONS.back} All deals</a>
 <div class="detail-grid"><div>
 <section class="glass detail-head"><div class="top">${chip(d)}<div><div class="meta" style="margin:0">${d.cat.toUpperCase()}</div></div></div>
  <div style="margin-top:22px"><h1>${d.name}</h1><div class="meta">${metaOf(d)}</div></div>
  <div class="pricebox"><div class="price-free">FREE</div><div class="price-old">${price(d)}</div></div>
  <a class="cta" href="#">Unlock ${d.name} ${ICONS.arrow}</a></section>
 <section class="section"><h3><i class="dot"></i>About</h3><p class="prose">${d.desc} Placeholder copy for the sample theme.</p></section>
 <section class="section"><h3><i class="dot"></i>How to claim</h3><div class="steps">
  <div class="glass step"><div><b>Tap unlock</b><span>We reveal the exclusive claim link.</span></div></div>
  <div class="glass step"><div><b>Sign up with the partner</b><span>Use the link so the deal is applied.</span></div></div>
  <div class="glass step"><div><b>Confirm in your dashboard</b><span>Value shows up in your total.</span></div></div></div></section>
 <section class="section"><h3><i class="dot"></i>Details</h3><div class="facts">
  <div class="glass fact"><small>You save</small><b>${money(d.old)}</b></div><div class="glass fact"><small>Claimed</small><b>${d.claimed.toLocaleString()}</b></div>
  <div class="glass fact"><small>Category</small><b>${d.cat}</b></div><div class="glass fact"><small>Term</small><b>12 months</b></div></div></section>
 </div>
 <div class="sticky"><section class="section" style="margin-top:0"><h3><i class="dot"></i>Similar deals</h3><ol class="list">${sim.map((x,i)=>`<li><a class="item" href="deal.html?id=${x.id}"><div class="rk">#${i+1}<i class="dot"></i></div>${chip(x)}<div class="nm"><b>${x.name}</b><span>${x.tag}</span></div><div class="pr"><s>FREE</s><span class="tag">FREE</span></div></a></li>`).join('')}</ol></section></div></div>`);
</script></body></html>
